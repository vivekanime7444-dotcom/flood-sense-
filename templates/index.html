<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FloodSense - Early Warning System</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-light: #f8fafc;
      --card-bg: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(255, 255, 255, 0.7);
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --text-main: #1e293b;
      --text-muted: #64748b;
      
      --risk-high: #ef4444;
      --risk-medium: #f59e0b;
      --risk-low: #10b981;
      --risk-normal: #3b82f6;
    }

    body { 
      font-family: 'Outfit', sans-serif; 
      margin: 0; 
      padding: 0; 
      background: var(--bg-light);
      color: var(--text-main);
      overflow-x: hidden;
    }
    
    /* Map acts as the full background */
    #map { 
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Overlay container that sits on top of the map */
    .app-overlay {
      position: relative;
      z-index: 10;
      width: 100%;
      min-height: 100vh;
      pointer-events: none; /* Let clicks pass through to map by default */
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      box-sizing: border-box;
    }
    
    .app-overlay > * {
      pointer-events: auto; /* Re-enable clicks for UI elements */
    }

    /* Top Search Bar / Header */
    header { 
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      padding: 1rem 2rem; 
      border-radius: 50px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 2rem;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    header h1 {
      margin: 0;
      font-size: 1.5rem;
      color: var(--accent);
      font-weight: 700;
      white-space: nowrap;
    }

    .search-container {
      display: flex;
      gap: 10px;
      width: 400px;
    }
    
    /* Dashboard Container - Wrapper */
    main { 
      display: grid; 
      grid-template-columns: 1fr 1fr;
      gap: 2rem; 
      width: 95%;
      max-width: 1400px; 
      opacity: 0;
      transform: translateY(30px) scale(0.95);
      transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.1);
      margin-top: 1rem;
    }
    
    main.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    
    /* Interactive Floating Windows / Tabs */
    section { 
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      padding: 2.5rem;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1), box-shadow 0.4s ease;
    }

    section:hover {
      transform: translateY(-10px) scale(1.01);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.18);
    }
    
    h2 {
      margin-top: 0;
      color: var(--text-main);
      font-weight: 700;
      font-size: 1.2rem;
      border-bottom: 1px solid rgba(0,0,0,0.05);
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    .risk-high { color: var(--risk-high); font-weight: 800; }
    .risk-medium { color: var(--risk-medium); font-weight: 800; }
    .risk-low { color: var(--risk-low); font-weight: 800; }
    .risk-normal { color: var(--risk-normal); font-weight: 800; }
    
    .gauge-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .gauge-item {
      padding: 15px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.8);
      display: flex;
      flex-direction: column;
      gap: 5px;
      transition: background 0.3s;
    }
    
    .gauge-item:hover {
      background: rgba(255, 255, 255, 0.9);
    }
    
    .gauge-item strong {
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .gauge-item span {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
    }
    
    .gauge-item small {
      color: #94a3b8;
      font-size: 0.8rem;
    }
    
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    
    input, select {
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 50px;
      color: var(--text-main);
      font-size: 15px;
      font-family: 'Outfit', sans-serif;
      transition: all 0.3s ease;
      outline: none;
      flex: 1;
    }
    
    input:focus, select:focus {
      background: #fff;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
    }
    
    button {
      background: var(--accent);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 15px;
      font-family: 'Outfit', sans-serif;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
    }
    
    button:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.3);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    .alert-btn {
      background: var(--risk-high);
    }
    
    .alert-btn:hover {
      background: #dc2626;
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
    }
    
    .status-card {
      text-align: center;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(255,255,255,0.8);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .status-card h3 {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 600;
    }
    
    .status-card p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    
    .status-card.alert {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.2);
      animation: pulseLight 2s infinite;
    }
    
    @keyframes pulseLight {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.3); }
      70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
  </style>
</head>
<body>
  <!-- Full Screen Map Background -->
  <div id="map"></div>

  <!-- Foreground UI Overlay -->
  <div class="app-overlay">
    
    <header id="top-search-bar">
      <h1>🌊 FloodSense</h1>
      <div class="search-container">
        <input type="text" id="locationSearch" placeholder="Enter any city or place to begin...">
        <button onclick="handleSearch()">Search</button>
      </div>
    </header>
    
    <main id="dashboard-main">
      <section>
        <h2>📊 Real-Time Dashboard</h2>
        <div id="statusCard" class="status-card">
          <div>
            <h3>Status: <span id="riskLevel">Loading...</span></h3>
            <p><strong>📍 <span id="stationName">Location</span></strong></p>
          </div>
          <div style="text-align: right;">
            <p>Last updated</p>
            <strong id="updateTime">--:--:--</strong>
          </div>
        </div>
        
        <div class="gauge-grid">
          <div class="gauge-item">
            <strong>💧 Water Level</strong>
            <div><span id="waterLevel">--</span> m</div>
            <small>Danger >4.5m</small>
          </div>
          <div class="gauge-item">
            <strong>🌧️ Rainfall</strong>
            <div><span id="rainfall">--</span> mm</div>
            <small>Danger >100mm</small>
          </div>
          <div class="gauge-item">
            <strong>🌡️ Temperature</strong>
            <div><span id="temperature">--</span> °C</div>
          </div>
          <div class="gauge-item">
            <strong>💨 Wind Speed</strong>
            <div><span id="windSpeed">--</span> m/s</div>
          </div>
        </div>
        <div style="margin-top: 15px; font-size: 0.85rem; color: #64748b; text-align: center;">
          <span id="stationLocation"></span> (ID: <span id="stationId"></span>)
        </div>
      </section>
      
      <section style="display: flex; flex-direction: column;">
        <h2>📈 Risk Assessment Chart</h2>
        <div class="controls">
          <button onclick="fetchStationData()">🔄 Refresh Data</button>
          <button onclick="simulateEmergency()" class="alert-btn">🚨 Emergency Simulator</button>
          <button onclick="resetData()">🔄 Reset to Normal</button>
        </div>
        <div style="flex-grow: 1; background: rgba(255,255,255,0.7); border-radius: 16px; padding: 10px; border: 1px solid rgba(0,0,0,0.05);">
          <canvas id="levelChart"></canvas>
        </div>
      </section>
    </main>
    
    <div id="alertStatus" style="position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 15px 30px; border-radius: 50px; display: none; font-weight: 600; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 9999;"></div>
    
  </div>

  <script>
    let isDashboardActive = false;
    
    // Initialize map centered on India, taking up full screen
    let map = L.map("map", { zoomControl: false }).setView([20.5937, 78.9629], 5);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap contributors"
    }).addTo(map);
    
    // Add zoom control to bottom right instead of top left
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    
    let chart;
    let historyData = [];

    // Add marker for our station, initial position doesn't matter much as it will be updated
    const stationMarker = L.marker([0, 0]).addTo(map);

    // Trigger search on Enter key
    document.getElementById("locationSearch").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        handleSearch();
      }
    });

    async function handleSearch() {
      const query = document.getElementById("locationSearch").value;
      if (!query) {
        showAlert("Please enter a location to search", "error");
        return;
      }
      
      try {
        // Hide dashboard immediately on new search
        isDashboardActive = false;
        document.getElementById("dashboard-main").classList.remove("visible");
        
        // Geocode using Nominatim API
        showAlert("🔍 Searching location...", "warning");
        const geocodeRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
        const geocodeData = await geocodeRes.json();
        
        if (geocodeData.length === 0) {
          showAlert("❌ Location not found", "error");
          return;
        }
        
        const bestMatch = geocodeData[0];
        const lat = parseFloat(bestMatch.lat);
        const lon = parseFloat(bestMatch.lon);
        const displayName = bestMatch.display_name.split(',')[0]; // Get the main name
        
        // Send to backend
        await fetch("http://localhost:5000/api/set-station", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: displayName, coords: [lat, lon] })
        });
        
        // Clear history to reset the graph
        historyData = [];
        if (chart) {
            chart.destroy();
            chart = null;
        }
        
        // Move search bar to the top left or make it compact immediately
        document.getElementById("top-search-bar").style.transform = "scale(0.9)";
        
        // Show the map zoom starting
        showAlert(`✅ Found ${displayName}. Zooming in...`, "success");
        
        // Fetch data which will trigger map.flyTo
        await fetchStationData(); 
        
        // Wait for the 2.5s flyTo animation to finish before showing dashboard
        setTimeout(() => {
          isDashboardActive = true;
          document.getElementById("dashboard-main").classList.add("visible");
        }, 2500);
        
      } catch (err) {
        console.error("Error searching location:", err);
        showAlert("❌ Failed to search location", "error");
      }
    }

    async function fetchStationData() {
      // Don't block the first fetch that triggers the map zoom!
      // Polling will still be gated by isDashboardActive in the interval.
      try {
        const response = await fetch("http://localhost:5000/api/station-data");
        const data = await response.json();
        
        updateDashboard(data);
        updateChart(data);
      } catch (err) {
        console.error("Error fetching station data:", err);
        showAlert("❌ Error connecting to API server. Make sure Flask is running on port 5000.", "error");
      }
    }



    async function simulateEmergency() {
      try {
        const response = await fetch("http://localhost:5000/api/simulate-emergency", {
          method: "POST"
        });
        
        const result = await response.json();
        showAlert("🚨 Emergency scenario activated!", "warning");
        fetchStationData(); // Refresh data to show emergency state
      } catch (err) {
        console.error("Error simulating emergency:", err);
        showAlert("❌ Failed to simulate emergency", "error");
      }
    }

    async function resetData() {
      try {
        const response = await fetch("http://localhost:5000/api/reset-data", {
          method: "POST"
        });
        
        const result = await response.json();
        showAlert("✅ Data reset to normal conditions", "success");
        fetchStationData(); // Refresh data
      } catch (err) {
        console.error("Error resetting data:", err);
        showAlert("❌ Failed to reset data", "error");
      }
    }

    function updateDashboard(data) {
      // Update risk level
      const riskLevelElement = document.getElementById("riskLevel");
      riskLevelElement.textContent = data.risk_level;
      riskLevelElement.className = `risk-${data.risk_level.toLowerCase()}`;
      
      // Update status card styling
      const statusCard = document.getElementById("statusCard");
      if (data.risk_level === "HIGH") {
        statusCard.classList.add("alert");
      } else {
        statusCard.classList.remove("alert");
      }
      
      // Update other fields
      document.getElementById("updateTime").textContent = new Date(data.timestamp).toLocaleTimeString();
      document.getElementById("stationName").textContent = data.station_name;
      document.getElementById("waterLevel").textContent = data.water_level;
      document.getElementById("rainfall").textContent = data.rainfall;
      if(data.temperature !== undefined) {
        document.getElementById("temperature").textContent = data.temperature;
      }
      if(data.wind_speed !== undefined) {
        document.getElementById("windSpeed").textContent = data.wind_speed;
      }
      document.getElementById("stationId").textContent = data.station_id;
      document.getElementById("stationLocation").textContent = data.location;
      
      // Update marker popup and position with current data
      if (data.coords) {
        stationMarker.setLatLng(data.coords);
        
        // Smooth zoom to the selected city
        map.flyTo(data.coords, 11, {
            animate: true,
            duration: 2.5 // Smooth 2.5 seconds flying animation
        });
      }
      stationMarker.setPopupContent(
        `<b>${data.station_name}</b><br>` +
        `Level: ${data.water_level}m (${data.risk_level} risk)<br>` +
        `Rainfall: ${data.rainfall}mm/24h<br>` +
        (data.temperature !== undefined ? `Temp: ${data.temperature}°C | Wind: ${data.wind_speed}m/s` : '')
      );
    }

    function updateChart(data) {
      // Add current reading to history
      historyData.push({
        timestamp: new Date(data.timestamp).toLocaleTimeString(),
        level: data.water_level,
        rainfall: data.rainfall
      });
      
      // Keep only last 10 readings
      if (historyData.length > 10) {
        historyData = historyData.slice(-10);
      }
      
      const ctx = document.getElementById("levelChart").getContext("2d");
      const labels = historyData.map(h => h.timestamp);
      const levels = historyData.map(h => h.level);
      const rainfall = historyData.map(h => h.rainfall);
      
      if (chart) {
        chart.destroy();
      }
      
      chart = new Chart(ctx, {
        type: "line",
        data: {
          labels: labels,
          datasets: [
            {
              label: "Water Level (m)",
              data: levels,
              borderColor: "rgb(54, 162, 235)",
              backgroundColor: "rgba(54, 162, 235, 0.1)",
              yAxisID: "y",
              tension: 0.3
            },
            {
              label: "Rainfall (mm)",
              data: rainfall,
              borderColor: "rgb(75, 192, 192)",
              backgroundColor: "rgba(75, 192, 192, 0.1)",
              yAxisID: "y1",
              tension: 0.3
            }
          ]
        },
        options: {
          responsive: true,
          interaction: {
            mode: "index",
            intersect: false,
          },
          scales: {
            y: {
              type: "linear",
              display: true,
              position: "left",
              title: {
                display: true,
                text: "Water Level (m)"
              }
            },
            y1: {
              type: "linear",
              display: true,
              position: "right",
              title: {
                display: true,
                text: "Rainfall (mm)"
              },
              grid: {
                drawOnChartArea: false,
              },
            }
          }
        }
      });
    }

    function showAlert(message, type) {
      const alertElement = document.getElementById("alertStatus");
      alertElement.textContent = message;
      alertElement.style.display = "block";
      alertElement.style.background = type === "error" ? "#ffebee" : 
                                    type === "warning" ? "#fff3e0" : "#e8f5e8";
      alertElement.style.color = type === "error" ? "#c62828" : 
                               type === "warning" ? "#f57c00" : "#2e7d32";
      
      setTimeout(() => {
        alertElement.style.display = "none";
      }, 5000);
    }

    // Start background interval, but it will only fetch if isDashboardActive is true
    setInterval(() => {
      if (isDashboardActive) fetchStationData();
    }, 3000); 
  </script>
</body>
</html>
